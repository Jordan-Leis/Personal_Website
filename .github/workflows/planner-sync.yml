# Keeps the "Work Blocks" Google Calendar in sync for jordanleis.com/to-do and
# /schedule. Reads the UW Portal and Outlook ICS feeds plus the primary Google
# calendar, regenerates blocks, and patches the calendar in place.
#
# This repo is public, so the job logs are too: scripts/planner prints counts
# and times only, never event titles or email content. All credentials are
# repository secrets. The job never commits and never triggers pages.yml.
name: planner-sync

on:
  schedule:
    # Every 10 minutes, offset from :00 to dodge GitHub's on-the-hour congestion.
    - cron: '3-59/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: planner-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/planner/requirements.txt

      - run: pip install -r scripts/planner/requirements.txt

      - name: Sync work blocks
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PORTAL_ICS_URL: ${{ secrets.PORTAL_ICS_URL }}
          OUTLOOK_ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
        run: python -m scripts.planner.sync_blocks --apply
