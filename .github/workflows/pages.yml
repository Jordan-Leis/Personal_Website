name: Publish website and daily atlas

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate the current puzzle even if unchanged
        type: boolean
        default: false
      rollback_run_id:
        description: Restore the complete site-release artifact from this successful run ID
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
    env:
      OPENBLAS_NUM_THREADS: '2'
      NLTK_DATA: ${{ github.workspace }}/.nltk_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts && npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out the reviewed solver revision
        if: inputs.rollback_run_id == ''
        uses: actions/checkout@v4
        with:
          repository: Jordan-Leis/linxicon-optimal-solver
          ref: 6181a8887934f622d3699ac2d52f54be88452525
          path: solver
          persist-credentials: false
      - name: Restore solver datasets and caches
        if: inputs.rollback_run_id == ''
        uses: actions/cache@v4
        with:
          path: |
            solver/data/cache
            solver/data/*.gz
            .nltk_data
          key: atlas-v1-${{ runner.os }}-${{ hashFiles('solver/requirements.txt', 'solver/linxicon_solver/similarity.py', 'solver/linxicon_solver/vocab.py') }}
      - name: Install generator dependencies
        if: inputs.rollback_run_id == ''
        run: python -m pip install -r solver/requirements.txt
      - name: Refresh the daily replay
        id: refresh
        if: inputs.rollback_run_id == ''
        env:
          ATLAS_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$ATLAS_FORCE" = 'true' ]; then args+=(--force); fi
          PYTHONPATH="$PWD/solver" python -m linxicon_solver.publish_daily \
            --output linxicon-solver/data \
            --previous-url https://jordanleis.com/linxicon-solver/data/ \
            --status /tmp/atlas-status.json "${args[@]}"
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/atlas-status.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('changed='+str(data['changed']).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Atlas update\n```json\n'+json.dumps(data,indent=2)+'\n```\n')
          PY
      - name: Decide whether publication is needed
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          ATLAS_CHANGED: ${{ steps.refresh.outputs.changed }}
        run: |
          if [ "$EVENT_NAME" != 'schedule' ] || [ "$ATLAS_CHANGED" = 'true' ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the existing Jekyll site
        if: steps.decision.outputs.publish == 'true' && inputs.rollback_run_id == ''
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Restore a previous complete website artifact
        if: inputs.rollback_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_RUN_ID: ${{ inputs.rollback_run_id }}
        run: |
          [[ "$ROLLBACK_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$ROLLBACK_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "site-release-$ROLLBACK_RUN_ID" --dir _site
      - name: Validate the complete site before publication
        if: steps.decision.outputs.publish == 'true'
        run: |
          python scripts/check_atlas.py _site
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/blog/index.html
          test -f _site/cracked-profiles/privacy/index.html
          ! grep -q '{{\|{%' _site/index.html
          ! test -d _site/solver
          ! test -d _site/node_modules
      - name: Keep the complete artifact for diagnosis and rollback
        if: steps.decision.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-release-${{ github.run_id }}
          path: _site
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: steps.decision.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
