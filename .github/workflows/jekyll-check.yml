# Builds the site with GitHub's own Pages builder so a branch can be
# verified before merging. Does not deploy — production still uses the
# production Pages workflow from main.
name: jekyll-check

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        posts: [seeded, empty]
    steps:
      - uses: actions/checkout@v4

      - name: Remove posts (empty-state check)
        if: matrix.posts == 'empty'
        run: rm -rf _posts

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Sanity checks
        run: |
          set -e
          python3 scripts/check_atlas.py _site
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/cracked-profiles/privacy/index.html
          test -f _site/blog/index.html
          if grep -q '{{\|{%' _site/index.html; then echo "Liquid leaked into index.html"; exit 1; fi
          # The mirrored awards site (synced by sync-awards-database.yml). Only
          # assert once it exists, so this check still passes on branches cut
          # before the first sync. Catches a _config.yml exclude/include change
          # dropping it — which would 404 in production rather than fail here.
          if [ -d awards-database ]; then
            test -f _site/awards-database/index.html
            test -f _site/awards-database/data/awards.json
          fi
          if [ "${{ matrix.posts }}" = "seeded" ]; then
            test -n "$(find _site/blog -mindepth 2 -name index.html)"
            grep -q 'class="post-entry"' _site/index.html
            ! grep -lE 'src="[A-Za-z][^:"]*"' _site/blog/*/index.html   # relative image paths inside posts never resolve
          else
            grep -q 'posts-empty' _site/index.html
            ! grep -q 'class="post-entry"' _site/index.html
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.posts }}
          path: _site

  # Browser checks run against the seeded build: the desktop's index.html
  # contains Liquid and needs Jekyll, and the atlas is static in the same tree.
  browser:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: site-seeded
          path: _site
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
          if-no-files-found: ignore
