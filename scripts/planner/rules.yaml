# Block rules for the "Work Blocks" calendar. Times are local (America/Toronto), HH:MM.
timezone: America/Toronto

term:
  start: 2026-10-12
  end: 2026-11-30

# Classes from these sources are ignored in these date ranges (the feed still lists them).
ignore_ranges:
  - { source: portal, start: 2026-10-12, end: 2026-10-18, reason: reading week }

off_weekdays: [sat]

work:
  start: "09:30"
  end: "21:00"
  max_minutes: 120
  break_minutes: 15
  min_minutes: 30

self_improvement:
  start: "21:00"
  end: "23:00"
  min_minutes: 30

# A meal goes at its preferred start if free; otherwise the nearest free quarter-hour
# start within +/- search_minutes. If nothing fits, the meal is skipped that day.
meals:
  lunch:
    default: { start: "12:00", minutes: 45 }
    search_minutes: 120
  dinner:
    mon: { start: "19:00", minutes: 45 }
    tue: { start: "18:30", minutes: 45 }
    wed: { start: "16:50", minutes: 40 }
    thu: { start: "18:00", minutes: 45 }
    fri: { start: "18:00", minutes: 45 }
    sun: { start: "18:00", minutes: 45 }
    search_minutes: 120

# Per-date exceptions. Meal overrides replace that day's preferred slot.
overrides:
  2026-10-27:
    lunch: { start: "14:20", minutes: 45 }
