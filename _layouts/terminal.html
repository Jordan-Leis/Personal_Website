<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} · {% endif %}Jordan Leis</title>
    <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
    <script>
        // Inside the desktop's browser window the page fills the frame;
        // on its own it sits in a terminal window on the wallpaper.
        if (window.self !== window.top) document.documentElement.classList.add('framed');
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #e95420;
            --win-header: #2b2b2b;
            --win-border: rgba(255, 255, 255, 0.08);
            --fg: #f7f7f7;
            --fg-muted: #9a9996;
            --term-bg: #300a24;
            --term-fg: #ffffff;
            --term-green: #8ae234;
            --term-blue: #729fcf;
            --term-cyan: #34e2e2;
            --term-yellow: #fce94f;
            --term-muted: #b7aeb3;
            --font-ui: 'Ubuntu', 'Noto Sans', 'DejaVu Sans', system-ui, sans-serif;
            --font-mono: 'Ubuntu Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace;
        }

        body {
            font-family: var(--font-mono);
            font-size: 15px;
            background:
                radial-gradient(ellipse 60% 55% at 85% 95%, rgba(233, 84, 32, 0.45), transparent 70%),
                linear-gradient(135deg, #2c001e 0%, #5e2750 55%, #772953 100%);
            background-attachment: fixed;
            color: var(--term-fg);
            line-height: 1.45;
            min-height: 100vh;
            padding: 3rem 1rem 4rem;
        }

        .window {
            width: min(900px, 100%);
            margin: 0 auto;
            background: var(--term-bg);
            border: 1px solid var(--win-border);
            border-radius: 8px 8px 0 0;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .window-header {
            height: 46px;
            background: var(--win-header);
            display: flex;
            align-items: center;
            padding: 0 8px 0 14px;
            position: relative;
            font-family: var(--font-ui);
        }

        .window-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: calc(100% - 140px);
        }

        .window-controls {
            margin-left: auto;
            display: flex;
            gap: 6px;
        }

        .window-control {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .window-control svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: var(--fg);
            stroke-width: 1.5;
        }

        .window-control.close {
            background: var(--orange);
        }

        .window-control.close svg {
            stroke: #fff;
            stroke-width: 1.8;
        }

        .window-content {
            padding: 12px 16px 20px;
        }

        .terminal-line {
            margin-bottom: 0.7em;
        }

        .prompt {
            color: var(--term-fg);
            font-weight: 700;
        }

        .prompt .user { color: var(--term-green); }
        .prompt .path { color: var(--term-blue); }

        .command {
            color: var(--term-fg);
        }

        .output {
            color: var(--term-fg);
        }

        /* span-scoped so it doesn't hit Rouge's <div class="highlight"> code blocks */
        span.highlight {
            color: var(--term-cyan);
            font-weight: 700;
        }

        .dir-comment {
            color: var(--term-muted);
        }

        .terminal-line a,
        .output a {
            color: var(--term-cyan);
            text-decoration: underline;
        }

        .terminal-line a:hover,
        .output a:hover {
            color: var(--term-green);
        }

        .post-entry {
            display: block;
            color: var(--term-fg);
            text-decoration: none;
            padding: 0.1em 0;
        }

        .post-entry:hover,
        .post-entry:hover span.highlight {
            color: var(--term-green);
        }

        .post-tags {
            color: var(--term-muted);
            margin-left: 0.5em;
        }

        .nav-line {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .nav-line a.command {
            margin-right: 1.5rem;
            text-decoration: none;
        }

        .nav-line a.command:hover {
            text-decoration: underline;
        }

        /* Framed inside the desktop browser: no chrome, fill the frame */
        .framed body {
            background: var(--term-bg);
            padding: 0;
        }

        .framed .window {
            width: 100%;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .framed .window-header,
        .framed .standalone-only {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem 0.5rem 3rem;
                font-size: 14px;
            }

            .window-content {
                padding: 10px 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="window-header">
            <div class="window-title">{{ page.window_title | default: page.title }}</div>
            <div class="window-controls">
                <div class="window-control minimize"><svg viewBox="0 0 16 16"><path d="M3.5 11h9"/></svg></div>
                <div class="window-control maximize"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg></div>
                <div class="window-control close"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg></div>
            </div>
        </div>
        <div class="window-content">
            {{ content }}

            <div class="terminal-line nav-line">
                <span class="prompt"><span class="user">jordan@waterloo</span>:<span class="path">~</span>$</span>
                <a class="command" href="{{ '/blog/' | relative_url }}">ls ~/posts/</a>
                <a class="command standalone-only" href="{{ '/' | relative_url }}">cd ~</a>
                <a class="command standalone-only" href="{{ '/' | relative_url }}?open={{ page.url }}" target="_top">open on desktop</a>
            </div>
        </div>
    </div>
</body>
</html>
